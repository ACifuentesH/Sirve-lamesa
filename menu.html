<!DOCTYPE html>
<html lang="es" ng-app="menuApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Sirve la mesa</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <style>
        @font-face {
            font-family: 'Rocket Raccoon';
            src: url('Rocket Raccoon Free.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Gildsley';
            src: url('Gildsley DEMO.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gildsley', sans-serif;
            background: #B8CEE8;
            min-height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            position: relative;
            overflow: hidden;
        }

        .title-container {
            position: relative;
            z-index: 1;
            margin-bottom: 5px;
        }

        h1 {
            font-family: 'Rocket Raccoon', sans-serif;
            color: #25533F;
            text-align: center;
            font-size: 1.8em;
            font-weight: normal;
            text-shadow: 2px 2px 4px rgba(37, 83, 63, 0.2);
            margin: 0;
        }

        .welcome-message {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-bottom: 5px;
            font-family: 'Gildsley', sans-serif;
            color: #25533F;
            font-size: 0.9em;
            font-weight: bold;
        }

        .scene-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 10px;
            background: #B8CEE8;
            border-radius: 15px;
            padding: 10px;
        }

        .table-scene {
            position: relative;
            width: 100%;
            min-height: 500px;
            max-height: 500px;
            background: #B8CEE8;
            border-radius: 15px;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .table-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            z-index: 1;
            margin: 0 auto;
        }

        .table-with-mantel {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .mesa-image {
            width: 100%;
            max-width: 800px;
            height: auto;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 1;
        }

        .mantel-image {
            position: absolute;
            width: 55%;
            max-width: 300px;
            height: auto;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: contain;
            z-index: 2;
        }

        .plate-container {
            position: absolute;
            width: 300px;
            height: 300px;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .plate-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
        }

        .plate-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 2;
            cursor: pointer;
        }

        .plate-area.drag-over {
            background: rgba(82, 165, 206, 0.2);
        }

        .food-on-plate {
            position: absolute;
            pointer-events: none;
            z-index: 6;
            transition: transform 0.2s ease;
        }

        .food-on-plate img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2));
        }

        .tabs-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 100%;
            background: transparent;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            flex-direction: row;
            gap: 10px;
            padding: 0 20px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-button {
            padding: 10px 20px;
            background: #FFFFFF;
            border: 3px solid #25533F;
            border-radius: 25px;
            font-family: 'Gildsley', sans-serif;
            font-size: 1em;
            font-weight: bold;
            color: #25533F;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tab-button:hover {
            background: #F8F8F8;
            border-color: #52A5CE;
        }

        .tab-button.active {
            background: #52A5CE;
            color: #FFFFFF;
            border-color: #52A5CE;
        }

        .menu-section {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 100%;
            background: transparent;
            padding: 10px 0;
            margin-bottom: 10px;
            display: none;
        }

        .menu-section.active {
            display: block;
        }

        .food-grid {
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 10px 20px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            scrollbar-color: #52A5CE #B8CEE8;
        }

        .food-grid::-webkit-scrollbar {
            height: 6px;
        }

        .food-grid::-webkit-scrollbar-track {
            background: #B8CEE8;
            border-radius: 10px;
        }

        .food-grid::-webkit-scrollbar-thumb {
            background: #52A5CE;
            border-radius: 10px;
        }

        .food-item {
            position: relative;
            width: 80px;
            height: 80px;
            background: transparent;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: all 0.3s ease;
            overflow: visible;
            flex-shrink: 0;
        }

        .food-item:hover {
            transform: scale(1.15);
        }

        .food-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .food-item img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.2));
        }

        .food-item.dragging {
            opacity: 0.5;
            transform: scale(0.9);
        }

        .button-container {
            position: relative;
            z-index: 1;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: bold;
            font-family: 'Gildsley', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #FF7BAC;
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(255, 123, 172, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 123, 172, 0.6);
            background: #EF6F3C;
        }

        .clear-plate-btn {
            background: #EF6F3C;
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(239, 111, 60, 0.4);
        }

        .clear-plate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(239, 111, 60, 0.6);
            background: #FF7BAC;
        }

        .plate.drag-over {
            opacity: 0.8;
        }

        .plate-container.drag-over .plate-image {
            filter: brightness(1.2) drop-shadow(0 0 15px rgba(82, 165, 206, 0.6));
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .table-scene {
                min-height: 500px;
            }

            .window-image {
                max-width: 100%;
            }

            .boy-container {
                width: 200px;
                bottom: 200px;
            }

            .mesa-image {
                max-width: 100%;
            }

            .mantel-image {
                width: 60%;
                max-width: 380px;
                top: 50%;
            }

            .plate-container {
                width: 130px;
                height: 130px;
                top: 50%;
            }

            .food-grid {
                gap: 15px;
                padding: 10px 15px;
            }

            .food-item {
                width: 80px;
                height: 80px;
            }

            .food-item img {
                width: 80px;
                height: 80px;
            }

            .btn {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>¡Sirve la mesa!</h1>
    </div>

    <div ng-controller="MenuController" class="content-wrapper">
        <div class="welcome-message" ng-if="usuario.nombres">
            ¡Hola, {{usuario.nombres}}! Arrastra la comida al plato
        </div>

        <div class="scene-container">
            <div class="table-scene">
                <div class="table-container">
                    <div class="table-with-mantel">
                        <img src="assets/mesa.png" alt="Mesa" class="mesa-image">
                        <img src="assets/mantel.png" alt="Mantel" class="mantel-image">
                        <div class="plate-container" id="plate-container">
                            <img src="assets/plato.png" alt="Plato" class="plate-image" id="plate">
                            <div class="plate-area" id="plate-area"
                                 ondrop="handleDrop(event)"
                                 ondragover="handleDragOver(event)"
                                 ondragenter="handleDragEnter(event)"
                                 ondragleave="handleDragLeave(event)">
                            </div>
                            <div class="food-on-plate" 
                                 ng-repeat="food in foodsOnPlate track by $index"
                                 ng-style="{'left': food.x + '%', 'top': food.y + '%', 'width': food.size + 'px', 'height': food.size + 'px', 'transform': 'translate(-50%, -50%) rotate(' + (food.rotation || 0) + 'deg)'}">
                                <img ng-src="assets/{{food.imagen}}" alt="{{food.nombre}}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tabs-container">
            <div class="tabs">
                <button class="tab-button" 
                        ng-repeat="categoria in categorias"
                        ng-class="{'active': activeTab === $index}"
                        ng-click="setActiveTab($index)">
                    {{categoria.nombre}}
                </button>
            </div>
        </div>

        <div class="menu-section" 
             ng-repeat="categoria in categorias"
             ng-class="{'active': activeTab === $index}">
            <div class="food-grid">
                <div class="food-item" 
                     ng-repeat="item in categoria.items"
                     draggable="true"
                     data-item-id="{{item.id}}"
                     ondragstart="handleDragStart(event)"
                     ondragend="handleDragEnd(event)">
                    <img ng-src="assets/{{item.imagen}}" alt="{{item.nombre}}"
                         ng-click="addFoodToPlate(item)"
                         onerror="this.style.display='none'"
                         draggable="false">
                </div>
            </div>
        </div>

        <div class="button-container">
            <button class="btn clear-plate-btn" ng-click="clearPlate()">Limpiar Plato</button>
            <button class="btn btn-primary" ng-click="finalizar()" ng-if="foodsOnPlate.length > 0">Finalizar Pedido</button>
        </div>
    </div>

    <script>
        angular.module('menuApp', [])
        .controller('MenuController', function($scope) {
            // Hacer el scope disponible globalmente para el drag and drop
            window.menuScope = $scope;
            
            // Cargar datos del usuario desde localStorage
            const datosUsuario = JSON.parse(localStorage.getItem('datosUsuario') || '{}');
            $scope.usuario = datosUsuario;

            // Si no hay datos, redirigir al inicio
            if (!datosUsuario.nombres) {
                window.location.href = 'index.html';
            }

            // Inicializar alimentos en el plato
            const savedPlate = JSON.parse(localStorage.getItem('foodsOnPlateCache') || '[]');
            $scope.foodsOnPlate = Array.isArray(savedPlate) ? savedPlate : [];

            // Inicializar pestaña activa
            $scope.activeTab = 0;

            // Función para cambiar de pestaña
            $scope.setActiveTab = function(index) {
                $scope.activeTab = index;
            };

            const persistPlate = () => {
                localStorage.setItem('foodsOnPlateCache', JSON.stringify($scope.foodsOnPlate));
            };

            const addFoodToCollection = (item, position) => {
                // Aumentar el tamaño de la comida en el plato (2.5x más grande)
                const plateSize = Math.round(item.size * 2.5);
                const foodOnPlate = {
                    id: item.id,
                    nombre: item.nombre,
                    imagen: item.imagen,
                    size: plateSize,
                    x: position.x,
                    y: position.y,
                    rotation: item.rotation || 0
                };
                $scope.foodsOnPlate.push(foodOnPlate);
                persistPlate();
                $scope.$applyAsync();
            };

            const randomPositionInsidePlate = (plateElement, itemSize) => {
                // Usar el tamaño aumentado para el cálculo
                const plateSize = Math.round(itemSize * 2.5);
                const plateRect = plateElement.getBoundingClientRect();
                // Usar el mismo radio reducido (90%) para que coincida con el área de drop
                const plateRadius = Math.min(plateRect.width, plateRect.height) / 2 * 0.9;
                let angle = Math.random() * 2 * Math.PI;
                let radius = Math.random() * (plateRadius - plateSize / 2);
                const x = (Math.cos(angle) * radius + plateRect.width / 2) / plateRect.width * 100;
                const y = (Math.sin(angle) * radius + plateRect.height / 2) / plateRect.height * 100;
                return { x, y };
            };

            $scope.addFoodToPlate = function(item) {
                const plateImage = document.getElementById('plate');
                if (!plateImage) return;
                // Verificar que no haya solapamiento excesivo
                let position = randomPositionInsidePlate(plateImage, item.size);
                const plateSize = Math.round(item.size * 2.5);
                const plateRect = plateImage.getBoundingClientRect();
                
                // Verificar solapamiento con alimentos existentes
                let attempts = 0;
                let validPosition = false;
                while (!validPosition && attempts < 50) {
                    const xPx = (position.x / 100) * plateRect.width;
                    const yPx = (position.y / 100) * plateRect.height;
                    let overlaps = false;
                    
                    for (const existing of $scope.foodsOnPlate) {
                        const existingX = (existing.x / 100) * plateRect.width;
                        const existingY = (existing.y / 100) * plateRect.height;
                        const distance = Math.sqrt(
                            Math.pow(xPx - existingX, 2) + Math.pow(yPx - existingY, 2)
                        );
                        // Reducir el solapamiento permitido a solo 5% (0.05) en lugar de 15%
                        const minDistance = (plateSize / 2) + (existing.size / 2) - (Math.min(plateSize, existing.size) * 0.05);
                        if (distance < minDistance) {
                            overlaps = true;
                            break;
                        }
                    }
                    
                    if (!overlaps) {
                        validPosition = true;
                    } else {
                        position = randomPositionInsidePlate(plateImage, item.size);
                        attempts++;
                    }
                }
                
                addFoodToCollection(item, position);
            };

            // Categorías y items del menú
            $scope.categorias = [
                {
                    nombre: 'Proteínas',
                    items: [
                        { id: 17, nombre: 'Carne', imagen: 'carne.png', size: 55 },
                        { id: 16, nombre: 'Muslo de Pollo', imagen: 'muslo_de_pollo.png', size: 50 },
                        { id: 20, nombre: 'Tocineta', imagen: 'tocineta.png', size: 45 },
                        { id: 21, nombre: 'Salchicha', imagen: 'salchicha.png', size: 40 },
                        { id: 19, nombre: 'Huevo Frito', imagen: 'huevo_frito.png', size: 45 },
                        { id: 18, nombre: 'Pescado', imagen: 'pescado.png', size: 55 }
                    ]
                },
                {
                    nombre: 'Verduras',
                    items: [
                        { id: 11, nombre: 'Pepino', imagen: 'pepino.png', size: 40 },
                        { id: 9, nombre: 'Tomate', imagen: 'tomate.png', size: 38 },
                        { id: 8, nombre: 'Aguacate', imagen: 'aguacate.png', size: 50 },
                        { id: 13, nombre: 'Espárragos', imagen: 'esparragos.png', size: 45 },
                        { id: 10, nombre: 'Tomate Cherry', imagen: 'tomate_cherry.png', size: 42 },
                        { id: 12, nombre: 'Zanahoria', imagen: 'zanahoria.png', size: 48 },
                        { id: 14, nombre: 'Papa', imagen: 'papa.png', size: 45 }
                    ]
                },
                {
                    nombre: 'Frutas',
                    items: [
                        { id: 4, nombre: 'Frambuesas', imagen: 'frambuesas.png', size: 40 },
                        { id: 6, nombre: 'Patilla', imagen: 'patilla.png', size: 55 },
                        { id: 7, nombre: 'Cambur', imagen: 'cambur.png', size: 45 },
                        { id: 5, nombre: 'Durazno', imagen: 'durazno.png', size: 45 },
                        { id: 3, nombre: 'Fresa', imagen: 'fresa.png', size: 40 },
                        { id: 1, nombre: 'Manzana', imagen: 'manzana.png', size: 45 }
                    ]
                },
                {
                    nombre: 'Panadería',
                    items: [
                        { id: 22, nombre: 'Pan Tostado', imagen: 'pan tostado.png', size: 50, rotation: -90 },
                        { id: 26, nombre: 'Crackers', imagen: 'crackers.png', size: 40 },
                        { id: 24, nombre: 'Croissant', imagen: 'croisant1.png', size: 45 },
                        { id: 25, nombre: 'Muffin', imagen: 'muffin.png', size: 45, rotation: -90 },
                        { id: 23, nombre: 'Bagle', imagen: 'bagle.png', size: 50 }
                    ]
                },
                {
                    nombre: 'Extras',
                    items: [
                        { id: 27, nombre: 'Nueces', imagen: 'nueces.png', size: 35 }
                    ]
                }
            ];

            // Variable global para el item que se está arrastrando
            window.draggedItem = null;

            // Función para limpiar el plato
            $scope.clearPlate = function() {
                $scope.foodsOnPlate = [];
                persistPlate();
                $scope.$applyAsync();
            };

            // Función para finalizar el pedido
            $scope.finalizar = function() {
                const pedido = {
                    usuario: $scope.usuario,
                    alimentos: $scope.foodsOnPlate,
                    fecha: new Date().toISOString()
                };
                
                localStorage.setItem('pedido', JSON.stringify(pedido));
                persistPlate();
                alert('¡Pedido realizado con éxito!\n\nHas servido ' + $scope.foodsOnPlate.length + ' alimentos en el plato.');
                console.log('Pedido:', pedido);
            };

            // Función para calcular posición inteligente en el plato
            function calculateSmartPosition(plateElement, itemSize) {
                // Usar el tamaño aumentado para el cálculo
                const plateSize = Math.round(itemSize * 2.5);
                const plateRect = plateElement.getBoundingClientRect();
                const plateWidth = plateRect.width;
                const plateHeight = plateRect.height;
                const plateCenterX = plateWidth / 2;
                const plateCenterY = plateHeight / 2;
                // Usar el mismo radio reducido (90%) para que coincida con el área de drop
                const plateRadius = Math.min(plateWidth, plateHeight) / 2 * 0.9;

                // Obtener posiciones existentes en píxeles
                const existingPositions = $scope.foodsOnPlate.map(food => {
                    const x = (food.x / 100) * plateWidth;
                    const y = (food.y / 100) * plateHeight;
                    return { x, y, size: food.size };
                });

                // Si no hay alimentos, colocar en el centro
                if (existingPositions.length === 0) {
                    return {
                        x: 50,
                        y: 50
                    };
                }

                // Intentar posiciones en espiral desde el centro
                let bestPosition = null;
                const angleStep = Math.PI / 12; // Más ángulos para mejor distribución
                const radiusStep = 20; // Pasos más pequeños para mejor cobertura
                const maxRadius = plateRadius - plateSize / 2;

                // Intentar más posiciones con un rango más amplio
                for (let radius = 20; radius <= maxRadius && !bestPosition; radius += radiusStep) {
                    for (let angle = 0; angle < 2 * Math.PI && !bestPosition; angle += angleStep) {
                        const x = plateCenterX + radius * Math.cos(angle);
                        const y = plateCenterY + radius * Math.sin(angle);

                        // Verificar que esté dentro del plato circular
                        const distanceFromCenter = Math.sqrt(
                            Math.pow(x - plateCenterX, 2) + Math.pow(y - plateCenterY, 2)
                        );

                        if (distanceFromCenter + plateSize / 2 <= plateRadius) {
                            // Verificar que no se superponga mucho con otros alimentos
                            // Permitir solo un pequeño solapamiento (5% máximo)
                            let overlaps = false;
                            for (const existing of existingPositions) {
                                const distance = Math.sqrt(
                                    Math.pow(x - existing.x, 2) + Math.pow(y - existing.y, 2)
                                );
                                // Reducir el solapamiento permitido a solo 5% (0.05) en lugar de 15%
                                const minDistance = (plateSize / 2) + (existing.size / 2) - (Math.min(plateSize, existing.size) * 0.05);
                                if (distance < minDistance) {
                                    overlaps = true;
                                    break;
                                }
                            }

                            if (!overlaps) {
                                bestPosition = { x, y };
                            }
                        }
                    }
                }

                // Si no se encontró posición, intentar posiciones aleatorias con más intentos
                if (!bestPosition) {
                    for (let i = 0; i < 200; i++) {
                        const angle = Math.random() * 2 * Math.PI;
                        const radius = Math.random() * (plateRadius - plateSize / 2);
                        const x = plateCenterX + radius * Math.cos(angle);
                        const y = plateCenterY + radius * Math.sin(angle);

                        let overlaps = false;
                        for (const existing of existingPositions) {
                            const distance = Math.sqrt(
                                Math.pow(x - existing.x, 2) + Math.pow(y - existing.y, 2)
                            );
                            // Reducir el solapamiento permitido a solo 5% (0.05) en lugar de 15%
                            const minDistance = (plateSize / 2) + (existing.size / 2) - (Math.min(plateSize, existing.size) * 0.05);
                            if (distance < minDistance) {
                                overlaps = true;
                                break;
                            }
                        }

                        if (!overlaps) {
                            bestPosition = { x, y };
                            break;
                        }
                    }
                }

                // Si aún no hay posición, buscar la posición más alejada de todos los alimentos existentes
                if (!bestPosition) {
                    let maxMinDistance = 0;
                    let bestCandidate = { x: plateCenterX, y: plateCenterY };
                    
                    // Probar varias posiciones y elegir la que tenga la mayor distancia mínima a todos los alimentos
                    for (let i = 0; i < 50; i++) {
                        const angle = Math.random() * 2 * Math.PI;
                        const radius = Math.random() * (plateRadius - plateSize / 2);
                        const x = plateCenterX + radius * Math.cos(angle);
                        const y = plateCenterY + radius * Math.sin(angle);
                        
                        // Calcular la distancia mínima a todos los alimentos existentes
                        let minDistToAll = Infinity;
                        for (const existing of existingPositions) {
                            const distance = Math.sqrt(
                                Math.pow(x - existing.x, 2) + Math.pow(y - existing.y, 2)
                            );
                            minDistToAll = Math.min(minDistToAll, distance);
                        }
                        
                        // Si esta posición tiene más espacio que la mejor candidata, usarla
                        if (minDistToAll > maxMinDistance) {
                            maxMinDistance = minDistToAll;
                            bestCandidate = { x, y };
                        }
                    }
                    
                    bestPosition = bestCandidate;
                }

                // Convertir a porcentajes
                return {
                    x: (bestPosition.x / plateWidth) * 100,
                    y: (bestPosition.y / plateHeight) * 100
                };
            }

            // Función para manejar el drop
            window.handleDrop = function(event) {
                event.preventDefault();
                const plateArea = document.getElementById('plate-area');
                const plateImage = document.getElementById('plate');
                plateArea.classList.remove('drag-over');

                if (window.draggedItem) {
                    const plateRect = plateImage.getBoundingClientRect();
                    const dropX = event.clientX - plateRect.left;
                    const dropY = event.clientY - plateRect.top;
                    
                    // Calcular el radio del plato de forma más precisa
                    // Reducir el radio para que coincida exactamente con el tamaño visual del plato
                    const plateWidth = plateRect.width;
                    const plateHeight = plateRect.height;
                    const centerX = plateWidth / 2;
                    const centerY = plateHeight / 2;
                    
                    // Usar un radio más pequeño (90% del radio total) para que coincida mejor con el plato visual
                    const radius = Math.min(plateWidth, plateHeight) / 2 * 0.9;
                    const distFromCenter = Math.sqrt(Math.pow(dropX - centerX, 2) + Math.pow(dropY - centerY, 2));
                    
                    // Solo aceptar drops dentro del radio del plato
                    if (distFromCenter <= radius) {
                        // Usar la posición exacta donde el usuario soltó la comida
                        const dropPosition = {
                            x: (dropX / plateWidth) * 100,
                            y: (dropY / plateHeight) * 100
                        };
                        addFoodToCollection(window.draggedItem, dropPosition);
                    }
                    // Si está fuera del plato, no hacer nada
                }

                window.draggedItem = null;
            };

            window.handleDragOver = function(event) {
                event.preventDefault();
                event.dataTransfer.dropEffect = 'copy';
            };

            window.handleDragEnter = function(event) {
                event.preventDefault();
                const plateArea = document.getElementById('plate-area');
                plateArea.classList.add('drag-over');
            };

            window.handleDragLeave = function(event) {
                const plateArea = document.getElementById('plate-area');
                plateArea.classList.remove('drag-over');
            };

            window.handleDragStart = function(event) {
                let item = null;
                
                // Obtener el elemento que se está arrastrando
                const dragElement = event.target;
                const itemId = dragElement.getAttribute('data-item-id');
                
                // Buscar el item usando el scope global
                if (window.menuScope && window.menuScope.categorias && itemId) {
                    for (let categoria of window.menuScope.categorias) {
                        item = categoria.items.find(i => i.id == itemId);
                        if (item) break;
                    }
                }
                
                // Si no se encontró por ID, intentar obtenerlo del scope directamente
                if (!item && dragElement) {
                    const scope = angular.element(dragElement).scope();
                    if (scope && scope.item) {
                        item = scope.item;
                    } else if (scope && scope.$parent && scope.$parent.item) {
                        item = scope.$parent.item;
                    }
                }
                
                if (!item) {
                    console.error('No se pudo obtener el item para arrastrar', event.target, itemId);
                    event.preventDefault();
                    return;
                }
                
                window.draggedItem = item;
                event.dataTransfer.effectAllowed = 'copy';
                try {
                    event.dataTransfer.setData('text/plain', JSON.stringify(item || {}));
                } catch (error) {
                    event.dataTransfer.setData('text/plain', '');
                }
                
                // Crear imagen de preview del drag
                const img = dragElement.querySelector('img');
                if (img) {
                    // Usar la imagen directamente si ya está cargada
                    if (img.complete && img.naturalWidth > 0) {
                        event.dataTransfer.setDragImage(img, img.width / 2, img.height / 2);
                    } else {
                        const dragPreview = new Image();
                        dragPreview.src = img.src;
                        dragPreview.width = 80;
                        dragPreview.height = 80;
                        dragPreview.onload = () => {
                            event.dataTransfer.setDragImage(dragPreview, dragPreview.width / 2, dragPreview.height / 2);
                        };
                    }
                }
                
                dragElement.classList.add('dragging');
            };

            window.handleDragEnd = function(event) {
                event.target.classList.remove('dragging');
            };
        });
    </script>
</body>
</html>
