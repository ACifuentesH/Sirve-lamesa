<div class="ingredientes-container">
  <!-- Botones fuera de la nevera -->
  <div class="tabs-container">
    <div class="tabs">
      <button
        *ngFor="let categoria of categorias"
        type="button"
        class="tab-button font-text"
        [class.active]="categoriaSeleccionada === categoria.id"
        (click)="filtrarPorCategoria(categoria.id)">
        <span class="icono">{{ categoria.icono }}</span>
        {{ categoria.nombre }}
      </button>
    </div>
  </div>

  <!-- Panel de ingredientes -->
  <div class="ingredientes-panel-content">
    <div class="food-grid" *ngIf="getIngredientesParaEscenario().length > 0">
      <app-ingrediente
        *ngFor="let ingrediente of getIngredientesParaEscenario()"
        [ingrediente]="ingrediente"
        (ingredienteArrastrado)="onIngredienteArrastrado($event)"
        (ingredienteSeleccionado)="onIngredienteSeleccionado($event)">
      </app-ingrediente>
    </div>
    <div class="no-ingredientes" *ngIf="getIngredientesParaEscenario().length === 0">
      <p class="font-text">No hay ingredientes en esta categoría</p>
    </div>
  </div>
</div>
