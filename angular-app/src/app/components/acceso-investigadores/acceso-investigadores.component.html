<main class="acceso">
  <form class="tarjeta" [formGroup]="formulario" (ngSubmit)="acceder()" novalidate>
    <h1>Acceso de investigadores</h1>
    <p class="ayuda">Panel de análisis del estudio. Solo para cuentas autorizadas.</p>

    <label class="campo">
      <span>Correo institucional</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="formulario.controls.email.touched && formulario.controls.email.invalid"
      />
      <small
        class="error-campo"
        *ngIf="formulario.controls.email.touched && formulario.controls.email.invalid"
      >
        Escribe un correo válido.
      </small>
    </label>

    <label class="campo">
      <span>Contraseña</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="formulario.controls.password.touched && formulario.controls.password.invalid"
      />
      <small
        class="error-campo"
        *ngIf="formulario.controls.password.touched && formulario.controls.password.invalid"
      >
        La contraseña es obligatoria.
      </small>
    </label>

    <!-- role=alert para que el lector de pantalla anuncie el fallo sin mover el foco. -->
    <p class="error-general" role="alert" *ngIf="error">{{ error }}</p>

    <button type="submit" class="acceder" [disabled]="enviando">
      {{ enviando ? 'Comprobando…' : 'Entrar' }}
    </button>
  </form>
</main>
