<div class="login-container">
  <div class="picnic-overlay"></div>
  
  <div class="title-container">
    <h1 class="font-title font-title-watermelon">¡Sirve la mesa!</h1>
  </div>
  
  <div class="container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="peso_kg" class="font-text">Peso (kg):</label>
        <input
          type="number"
          id="peso_kg"
          formControlName="peso_kg"
          placeholder="Ingresa tu peso"
          min="1"
          max="500"
          step="0.1"
          class="font-text"
          [class.error]="pesoKg?.invalid && pesoKg?.touched">
        <div *ngIf="pesoKg?.invalid && pesoKg?.touched" class="error-message">
          <small *ngIf="pesoKg?.errors?.['required']">El peso es requerido</small>
          <small *ngIf="pesoKg?.errors?.['min'] || pesoKg?.errors?.['max']">El peso debe estar entre 1 y 500 kg</small>
        </div>
      </div>

      <div class="form-group">
        <label class="font-text">Sexo:</label>
        <div class="radio-group">
          <div class="radio-option">
            <input 
              type="radio" 
              id="masculino" 
              value="masculino" 
              formControlName="sexo">
            <label for="masculino" class="font-text">Masculino</label>
          </div>
          <div class="radio-option">
            <input 
              type="radio" 
              id="femenino" 
              value="femenino" 
              formControlName="sexo">
            <label for="femenino" class="font-text">Femenino</label>
          </div>
          <div class="radio-option">
            <input 
              type="radio" 
              id="otro" 
              value="otro" 
              formControlName="sexo">
            <label for="otro" class="font-text">Otro</label>
          </div>
        </div>
        <div *ngIf="sexo?.invalid && sexo?.touched" class="error-message">
          <small>El sexo es requerido</small>
        </div>
      </div>

      <div class="form-group">
        <label for="edad" class="font-text">Edad:</label>
        <input 
          type="number" 
          id="edad" 
          formControlName="edad" 
          placeholder="Ingresa tu edad" 
          min="1" 
          max="120"
          class="font-text"
          [class.error]="edad?.invalid && edad?.touched">
        <div *ngIf="edad?.invalid && edad?.touched" class="error-message">
          <small *ngIf="edad?.errors?.['required']">La edad es requerida</small>
          <small *ngIf="edad?.errors?.['min'] || edad?.errors?.['max']">La edad debe estar entre 1 y 120 años</small>
        </div>
      </div>

      <div class="form-group">
        <label for="altura_cm" class="font-text">Estatura (cm):</label>
        <input
          type="number"
          id="altura_cm"
          formControlName="altura_cm"
          placeholder="Ingresa tu estatura"
          min="30"
          max="250"
          step="0.1"
          class="font-text"
          [class.error]="alturaCm?.invalid && alturaCm?.touched">
        <div *ngIf="alturaCm?.invalid && alturaCm?.touched" class="error-message">
          <small *ngIf="alturaCm?.errors?.['required']">La estatura es requerida</small>
          <small *ngIf="alturaCm?.errors?.['min'] || alturaCm?.errors?.['max']">La estatura debe estar entre 30 y 250 cm</small>
        </div>
      </div>
    </form>

    <div *ngIf="error" class="error-alert">
      {{ error }}
    </div>
  </div>
  
  <div class="button-container">
    <button
      type="submit"
      (click)="onSubmit()"
      class="btn-continue font-text"
      [disabled]="loading || loginForm.invalid">
      <span *ngIf="!loading">Continuar</span>
      <span *ngIf="loading">Cargando...</span>
    </button>
  </div>

  <button type="button" class="btn-admin font-text" (click)="goToAdmin()">⚙</button>
</div>
