<div class="login-container">
  <div class="picnic-overlay"></div>
  
  <div class="title-container">
    <h1 class="font-title font-title-watermelon">¡Sirve la mesa!</h1>
  </div>
  
  <div class="container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="nombres" class="font-text">Nombres:</label>
        <input 
          type="text" 
          id="nombres" 
          formControlName="nombres" 
          placeholder="Ingresa tus nombres"
          class="font-text"
          [class.error]="nombres?.invalid && nombres?.touched">
        <div *ngIf="nombres?.invalid && nombres?.touched" class="error-message">
          <small *ngIf="nombres?.errors?.['required']">Los nombres son requeridos</small>
          <small *ngIf="nombres?.errors?.['minlength']">Los nombres deben tener al menos 2 caracteres</small>
        </div>
      </div>

      <div class="form-group">
        <label class="font-text">Sexo:</label>
        <div class="radio-group">
          <div class="radio-option">
            <input 
              type="radio" 
              id="masculino" 
              value="masculino" 
              formControlName="sexo">
            <label for="masculino" class="font-text">Masculino</label>
          </div>
          <div class="radio-option">
            <input 
              type="radio" 
              id="femenino" 
              value="femenino" 
              formControlName="sexo">
            <label for="femenino" class="font-text">Femenino</label>
          </div>
          <div class="radio-option">
            <input 
              type="radio" 
              id="otro" 
              value="otro" 
              formControlName="sexo">
            <label for="otro" class="font-text">Otro</label>
          </div>
        </div>
        <div *ngIf="sexo?.invalid && sexo?.touched" class="error-message">
          <small>El sexo es requerido</small>
        </div>
      </div>

      <div class="form-group">
        <label for="edad" class="font-text">Edad:</label>
        <input 
          type="number" 
          id="edad" 
          formControlName="edad" 
          placeholder="Ingresa tu edad" 
          min="1" 
          max="120"
          class="font-text"
          [class.error]="edad?.invalid && edad?.touched">
        <div *ngIf="edad?.invalid && edad?.touched" class="error-message">
          <small *ngIf="edad?.errors?.['required']">La edad es requerida</small>
          <small *ngIf="edad?.errors?.['min'] || edad?.errors?.['max']">La edad debe estar entre 1 y 120 años</small>
        </div>
      </div>
    </form>

    <div *ngIf="error" class="error-alert">
      {{ error }}
    </div>
  </div>
  
  <div class="button-container">
    <button 
      type="submit" 
      (click)="onSubmit()" 
      class="btn-continue font-text"
      [disabled]="loading || loginForm.invalid">
      <span *ngIf="!loading">Continuar</span>
      <span *ngIf="loading">Cargando...</span>
    </button>
  </div>
</div>
