<div class="personajes-container">
  <div class="personaje-card" 
       *ngFor="let personaje of personajes"
       [class.activo]="personajeActual?.id === personaje.id"
       [class.servido]="personaje.estado === 'servido'"
       [class.clickable]="personaje.estado !== 'servido'"
       (click)="seleccionarPersonaje(personaje)">
    
    <div class="personaje-imagen-container">
      <img [src]="getImagePath(personaje.imagen)" 
           [alt]="personaje.nombre"
           class="personaje-imagen">
      <div class="estado-overlay" *ngIf="personaje.estado === 'servido'">
        <span class="check-icon">✓</span>
      </div>
    </div>
    
    <h4 class="personaje-nombre font-text">{{ personaje.nombre }}</h4>
  </div>
</div>
