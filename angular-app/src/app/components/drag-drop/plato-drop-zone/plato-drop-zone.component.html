<div class="plato-container">
  <div class="plato-drop-zone"
       cdkDropList
       [cdkDropListData]="ingredientesEnPlato"
       (cdkDropListDropped)="onDrop($event)">

    <img [src]="platoImagen" alt="Plato" class="plato-imagen">

    <div class="ingredientes-en-plato">
      <div *ngFor="let item of ingredientesEnPlato; let i = index" class="ingrediente-item">
        <img [src]="getImagePath(item.ingrediente.imagen)"
             [alt]="item.ingrediente.nombre"
             class="ingrediente-mini">

        <div class="ingrediente-info">
          <span class="nombre font-text">{{ item.ingrediente.nombre }}</span>
          <div class="cantidad-control">
            <input type="number"
                   [(ngModel)]="item.cantidad"
                   (ngModelChange)="actualizarCantidad(i, $event)"
                   min="0"
                   step="10"
                   class="cantidad-input">
            <span class="unidad">{{ item.unidad }}</span>
          </div>
        </div>

        <button class="btn-eliminar" (click)="eliminarIngrediente(i)" title="Eliminar">
          ✕
        </button>
      </div>
    </div>

    <div class="mensaje-vacio" *ngIf="ingredientesEnPlato.length === 0">
      <p class="font-text">Arrastra ingredientes aquí</p>
    </div>
  </div>

  <div class="plato-info">
    <div class="cantidad-total">
      <span class="label font-text">Total:</span>
      <span class="value font-text">{{ cantidadTotal }} gramos</span>
    </div>

    <button class="btn-servir font-text"
            (click)="servirPlato()"
            [disabled]="ingredientesEnPlato.length === 0">
      Servir Plato
    </button>
  </div>
</div>
