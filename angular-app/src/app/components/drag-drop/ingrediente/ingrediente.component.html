<div class="food-item"
     draggable="true"
     (dragstart)="onDragStart($event)"
     (dragend)="onDragEnd()"
     (click)="onSeleccionar()"
     (keydown.enter)="onSeleccionar()"
     (keydown.space)="onSeleccionar(); $event.preventDefault()"
     [attr.tabindex]="0"
     role="button"
     [attr.aria-label]="'Agregar ' + ingrediente.nombre"
     [class.dragging]="isDragging">
  <img [src]="getImagePath()"
       [alt]="ingrediente.nombre"
       draggable="false">
</div>
