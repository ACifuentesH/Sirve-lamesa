<div #foodRoot
     class="food-item"
     (pointerdown)="onPointerDown($event)"
     (click)="onRootClick($event)"
     (keydown.enter)="onSeleccionar()"
     (keydown.space)="onSeleccionar(); $event.preventDefault()"
     [attr.tabindex]="0"
     role="button"
     [attr.aria-label]="'Agregar ' + ingrediente.nombre"
     [class.dragging]="isDragging">
  <img [src]="getImagePath()"
       [alt]="ingrediente.nombre"
       [attr.data-imagen]="ingrediente.imagen"
       draggable="false">
  <span class="food-label">{{ ingrediente.nombre }}</span>
</div>
