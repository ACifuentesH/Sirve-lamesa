<div class="game-container">
  <!-- Header -->
  <header class="game-header">
    <h1 class="font-title font-title-watermelon">{{ getNombreEscenario() }}</h1>
    <div class="participante-info">
      <span class="font-text">{{ authService.getParticipante()?.nombres }}</span>
    </div>
  </header>

  <!-- Mensajes -->
  <div class="mensajes-container">
    <div class="mensaje-exito font-text" *ngIf="mensajeExito">
      {{ mensajeExito }}
    </div>
    <div class="mensaje-error font-text" *ngIf="mensajeError">
      {{ mensajeError }}
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="game-content" *ngIf="!juegoCompletado">
    <!-- Panel izquierdo: Personajes -->
    <aside class="personajes-panel">
      <h2 class="font-title font-title-watermelon">Personajes</h2>
      <app-personajes
        [personajes]="personajes"
        [personajeActual]="personajeActual"
        (personajeSeleccionado)="onPersonajeSeleccionado($event)">
      </app-personajes>
    </aside>

    <!-- Centro: Plato e Ingredientes -->
    <main class="plato-section">
      <div class="personaje-actual-info" *ngIf="personajeActual">
        <h3 class="font-title font-title-watermelon">Sirviendo a: <span class="font-text">{{ personajeActual.nombre }}</span></h3>
      </div>

      <app-plato-drop-zone
        [ingredientesEnPlato]="ingredientesEnPlato"
        [personajeActual]="personajeActual"
        (ingredienteAgregado)="onIngredienteAgregado($event)"
        (ingredienteEliminado)="onIngredienteEliminado($event)"
        (platoServido)="onPlatoServido($event)"
        (limpiarSolicitado)="onLimpiarPlato()">
      </app-plato-drop-zone>

      <!-- Panel de ingredientes debajo de la mesa -->
      <aside class="ingredientes-panel">
        <h2 class="font-title font-title-watermelon">Ingredientes</h2>
        <app-ingredientes
          [ingredientes]="ingredientes"
          [escenarioActual]="escenarioActual"
          (ingredienteSeleccionado)="onIngredienteSeleccionado($event)">
        </app-ingredientes>
      </aside>
    </main>
  </div>

  <!-- Pantalla de juego completado -->
  <div class="juego-completado" *ngIf="juegoCompletado">
    <div class="completado-content">
      <h1 class="font-title">¡Felicidades!</h1>
      <p class="font-text">Has completado el juego exitosamente</p>
      <p class="font-text">Gracias por participar en nuestro estudio</p>
      <div class="loading-spinner" *ngIf="enviandoDecisiones"></div>
    </div>
  </div>

</div>
