<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirve la mesa</title>
    <style>
        @font-face {
            font-family: 'Rocket Raccoon';
            src: url('Rocket Raccoon Free.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Gildsley';
            src: url('Gildsley DEMO.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FFFFFF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Patrón de mantel a cuadros de picnic */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, rgba(82, 165, 206, 0.25) 50%, transparent 50%),
                linear-gradient(90deg, rgba(82, 165, 206, 0.25) 50%, transparent 50%),
                linear-gradient(0deg, rgba(184, 206, 232, 0.15) 50%, transparent 50%),
                linear-gradient(90deg, rgba(184, 206, 232, 0.15) 50%, transparent 50%);
            background-size: 
                80px 80px,
                80px 80px,
                160px 160px,
                160px 160px;
            background-position: 
                0 0,
                0 0,
                80px 80px,
                80px 80px;
            opacity: 1;
            z-index: 0;
            animation: picnicPattern 30s linear infinite;
        }

        /* Elementos decorativos de picnic */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(82, 165, 206, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(184, 206, 232, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 60%, rgba(82, 165, 206, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 90% 10%, rgba(184, 206, 232, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 20% 90%, rgba(82, 165, 206, 0.08) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes picnicPattern {
            0% {
                background-position: 
                    0 0,
                    0 0,
                    80px 80px,
                    80px 80px;
            }
            50% {
                background-position: 
                    40px 40px,
                    40px 40px,
                    120px 120px,
                    120px 120px;
            }
            100% {
                background-position: 
                    0 0,
                    0 0,
                    80px 80px,
                    80px 80px;
            }
        }

        /* Patrón de líneas sutiles adicionales */
        .picnic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(82, 165, 206, 0.08) 2px,
                    rgba(82, 165, 206, 0.08) 4px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(184, 206, 232, 0.08) 2px,
                    rgba(184, 206, 232, 0.08) 4px
                );
            background-size: 100% 40px, 40px 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .title-container {
            position: relative;
            z-index: 1;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Rocket Raccoon', sans-serif;
            color: #25533F;
            text-align: center;
            font-size: 3em;
            font-weight: normal;
            text-shadow: 2px 2px 4px rgba(37, 83, 63, 0.2);
            margin: 0;
        }

        .container {
            background: linear-gradient(135deg, #FFFFFF 0%, #F8F8F8 100%);
            border-radius: 50%;
            width: 500px;
            height: 500px;
            padding: 60px 40px;
            position: relative;
            z-index: 1;
            box-shadow: 
                0 15px 35px rgba(37, 83, 63, 0.3),
                inset 0 0 30px rgba(82, 165, 206, 0.1),
                0 0 0 8px rgba(255, 255, 255, 0.9),
                0 0 0 10px rgba(184, 206, 232, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(82, 165, 206, 0.1) 0%, rgba(184, 206, 232, 0.1) 100%);
            z-index: -1;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #25533F;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1em;
            font-family: 'Gildsley', sans-serif;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 14px 16px;
            border: 3px solid #25533F;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            background-color: #FFFFFF;
            color: #25533F;
            font-family: 'Gildsley', sans-serif;
        }

        input::placeholder {
            color: #52A5CE;
            opacity: 0.7;
            font-weight: bold;
            font-family: 'Gildsley', sans-serif;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #52A5CE;
            background-color: #F8F8F8;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #52A5CE;
            cursor: pointer;
        }

        .radio-option label {
            color: #25533F;
            font-weight: bold;
            margin-bottom: 0;
            cursor: pointer;
            font-size: 1em;
            font-family: 'Gildsley', sans-serif;
        }

        .button-container {
            position: relative;
            z-index: 1;
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .btn-continue {
            padding: 18px 50px;
            background: #FF7BAC;
            color: #FFFFFF;
            border: none;
            border-radius: 50px;
            font-size: 1.3em;
            font-weight: bold;
            font-family: 'Gildsley', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 123, 172, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-continue:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 123, 172, 0.6);
            background: #EF6F3C;
        }

        .btn-continue:active {
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            body::before {
                background-size:                     60px 60px,
                    60px 60px,
                    120px 120px,
                    120px 120px;
                background-position: 
                    0 0,
                    0 0,
                    60px 60px,
                    60px 60px;
            }

            .picnic-overlay {
                background-size: 100% 30px, 30px 100%;
            }

            .title-container {
                margin-bottom: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .container {
                width: 350px;
                height: 350px;
                padding: 40px 30px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .radio-group {
                flex-direction: column;
                gap: 10px;
            }

            .button-container {
                margin-top: 30px;
            }

            .btn-continue {
                padding: 15px 40px;
                font-size: 1.1em;
            }
        }

        @media (min-width: 1200px) {
            body::before {
                background-size: 
                    100px 100px,
                    100px 100px,
                    200px 200px,
                    200px 200px;
            }

            .picnic-overlay {
                background-size: 100% 50px, 50px 100%;
            }
        }
    </style>
</head>
<body>
    <div class="picnic-overlay"></div>
    <div class="title-container">
        <h1>¡Sirve la mesa!</h1>
    </div>
    <div class="container">
        <form id="formulario">
            <div class="form-group">
                <label for="peso_kg">Peso (kg):</label>
                <input type="number" id="peso_kg" name="peso_kg" required placeholder="Ingresa tu peso" min="1" max="500" step="0.1">
            </div>

            <div class="form-group">
                <label for="sexo">Sexo:</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="masculino" name="sexo" value="masculino" required>
                        <label for="masculino">Masculino</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="femenino" name="sexo" value="femenino" required>
                        <label for="femenino">Femenino</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="otro" name="sexo" value="otro" required>
                        <label for="otro">Otro</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required placeholder="Ingresa tu edad" min="1" max="120">
            </div>

            <div class="form-group">
                <label for="altura_cm">Estatura (cm):</label>
                <input type="number" id="altura_cm" name="altura_cm" required placeholder="Ingresa tu estatura" min="30" max="250" step="0.1">
            </div>
        </form>
    </div>
    <div class="button-container">
        <button type="submit" form="formulario" class="btn-continue">Continuar</button>
    </div>

    <script>
        document.getElementById('formulario').addEventListener('submit', function(e) {
            e.preventDefault();
            const peso_kg = document.getElementById('peso_kg').value;
            const sexo = document.querySelector('input[name="sexo"]:checked').value;
            const edad = document.getElementById('edad').value;
            const altura_cm = document.getElementById('altura_cm').value;
            
            console.log('Datos del formulario:', { peso_kg, sexo, edad, altura_cm });
            alert('Formulario enviado correctamente. Datos: ' + JSON.stringify({ peso_kg, sexo, edad, altura_cm }, null, 2));
        });
    </script>
</body>
</html>
